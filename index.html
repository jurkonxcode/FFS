<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Founder Fantasy Simulator - Jurkon Studio"
    >

    <title>
        Founder Fantasy Simulator
    </title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <main id="ffs-app">


        <!-- ==================================================
             HEADER
        =================================================== -->

        <header class="ffs-header">

            <div class="ffs-brand">

                <div
                    id="app-title"
                    class="ffs-title"
                >
                    Founder Fantasy Simulator
                </div>

                <div class="ffs-studio">
                    Jurkon Studio
                </div>

            </div>


            <div class="ffs-language">

                <button
                    id="language-id"
                    type="button"
                >
                    Indonesia
                </button>

                <button
                    id="language-en"
                    type="button"
                >
                    English
                </button>

            </div>

        </header>


        <!-- ==================================================
             DUAL WORLD TIME
        =================================================== -->

        <section
            class="ffs-time-panel"
            aria-label="FFS World Time"
        >

            <div class="ffs-time-card">

                <div
                    id="real-world-label"
                    class="ffs-time-label"
                >
                    DUNIA NYATA
                </div>

                <div
                    id="real-world-time"
                    class="ffs-time-value"
                >
                    -
                </div>

            </div>


            <div
                class="ffs-time-arrow"
                aria-hidden="true"
            >
                →
            </div>


            <div class="ffs-time-card">

                <div
                    id="ffs-world-label"
                    class="ffs-time-label"
                >
                    DUNIA FFS
                </div>

                <div
                    id="ffs-world-time"
                    class="ffs-time-value"
                >
                    -
                </div>

            </div>

        </section>


        <!-- ==================================================
             WORLD INTRO
        =================================================== -->

        <section class="ffs-world-intro">

            <h1>
                FFS WORLD
            </h1>

            <p id="world-status">
                Menyiapkan Dunia FFS...
            </p>

            <p id="world-description">
                World Engine sedang mempersiapkan dunia.
            </p>

        </section>


        <!-- ==================================================
             WORLD MAP
        =================================================== -->

        <section
            class="ffs-world-section"
            aria-label="FFS World Map"
        >

            <div
                id="ffs-map-container"
            ></div>

        </section>


        <!-- ==================================================
             FOOTER
        =================================================== -->

        <footer class="ffs-footer">

            <div>
                Jurkon Studio
            </div>

            <div>
                Founder Fantasy Simulator
            </div>

            <div>
                FFS
            </div>

        </footer>


    </main>


    <!-- =====================================================
         APPLICATION
    ====================================================== -->

    <script
        type="module"
        src="./main.js"
    ></script>

</body>

</html>
