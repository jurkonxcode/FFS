<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Founder Fantasy Simulator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="top-bar">

        <div class="brand">
            <strong>FFS</strong>
            <span>Founder Fantasy Simulator</span>
        </div>

        <div class="time-panel">

            <div class="time-box">
                <small>REAL WORLD</small>
                <strong id="real-time">29 August 2026</strong>
            </div>

            <div class="time-box">
                <small>FFS WORLD</small>
                <strong id="ffs-time">29 August 1996</strong>
            </div>

        </div>

    </header>

    <main id="game-world">

        <div id="loading">
            Initializing FFS World...
        </div>

    </main>

    <script src="main.js"></script>

</body>
</html>
